name: Release build (formula)

# Rewrites the Homebrew formula for the release. ri-release-homebrew does not
# fit: it refuses to run without Linux archives, and this program is macOS only.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: archives
          merge-multiple: true

      # upload-artifact strips the common parent, so the formula is staged
      # below a directory that holds its repository path.
      - name: Rewrite the formula
        env:
          VERSION: ${{ inputs.version }}
        run: |
          packaging/update-formula.sh "$VERSION" archives Formula/tmreportwell.rb
          mkdir -p stage/Formula
          cp Formula/tmreportwell.rb stage/Formula/

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: stage
          if-no-files-found: error
